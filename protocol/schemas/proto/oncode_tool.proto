syntax = "proto3";

package oncode.tool.v1;

option go_package = "oncode/protocol/gen/toolv1;toolv1";

// Logical onCode Tool Protocol v1. JSON field names are the protocol names.
// protobuf is a transport adapter; do not introduce a second semantic model.

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  REQUEST = 1;
  RESPONSE = 2;
  EVENT = 3;
  CANCEL = 4;
  ACK = 5;
}

enum ToolStatus {
  TOOL_STATUS_UNSPECIFIED = 0;
  SUCCESS = 1;
  FAILED = 2;
  PARTIAL = 3;
  ACCEPTED = 4;
  RUNNING = 5;
  CANCELLED = 6;
  REJECTED = 7;
  TIMEOUT = 8;
}

enum ActorType {
  ACTOR_TYPE_UNSPECIFIED = 0;
  USER = 1;
  AGENT = 2;
  ORCHESTRATOR = 3;
  LOCAL_AGENT = 4;
  IDE = 5;
  SYSTEM = 6;
}

enum ChangeOperation {
  CHANGE_OPERATION_UNSPECIFIED = 0;
  CREATE = 1;
  MODIFY = 2;
  DELETE = 3;
  RENAME = 4;
}

enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  APPROVE = 1;
  REJECT = 2;
}

message Actor {
  ActorType type = 1 [json_name = "type"];
  string id = 2 [json_name = "id"];
}

message Target {
  string type = 1 [json_name = "type"];
  string id = 2 [json_name = "id"];
}

message Envelope {
  string protocol = 1 [json_name = "protocol"];
  MessageType message_type = 2 [json_name = "message_type"];
  string message_id = 3 [json_name = "message_id"];
  string timestamp = 4 [json_name = "timestamp"];
  string session_id = 5 [json_name = "session_id"];
  string project_id = 6 [json_name = "project_id"];
  string workspace_id = 7 [json_name = "workspace_id"];
  string workflow_id = 8 [json_name = "workflow_id"];
  string work_item_id = 9 [json_name = "work_item_id"];
  string task_id = 10 [json_name = "task_id"];
  Actor actor = 11 [json_name = "actor"];
  Target target = 12 [json_name = "target"];
  ToolRequestPayload tool_request = 20 [json_name = "tool_request"];
  ToolResponsePayload tool_response = 21 [json_name = "tool_response"];
  EventPayload event_payload = 22 [json_name = "event_payload"];
}

message ToolRequestPayload {
  string call_id = 1 [json_name = "call_id"];
  string tool = 2 [json_name = "tool"];
  string arguments_json = 3 [json_name = "arguments_json"];
  int32 timeout_ms = 4 [json_name = "timeout_ms"];
}

message ToolError {
  string code = 1 [json_name = "code"];
  string category = 2 [json_name = "category"];
  string message = 3 [json_name = "message"];
  bool retryable = 4 [json_name = "retryable"];
  string details_json = 5 [json_name = "details_json"];
}

message Metrics {
  int64 duration_ms = 1 [json_name = "duration_ms"];
}

message ToolResponsePayload {
  string call_id = 1 [json_name = "call_id"];
  ToolStatus status = 2 [json_name = "status"];
  string result_json = 3 [json_name = "result_json"];
  ToolError error = 4 [json_name = "error"];
  Metrics metrics = 5 [json_name = "metrics"];
}

message EventPayload {
  string event = 1 [json_name = "event"];
  string execution_id = 2 [json_name = "execution_id"];
  string data_json = 3 [json_name = "data_json"];
}

message Heartbeat {
  string agent_id = 1 [json_name = "agent_id"];
  string protocol_version = 2 [json_name = "protocol_version"];
  string timestamp = 3 [json_name = "timestamp"];
}

message Platform {
  string os = 1 [json_name = "os"];
  string arch = 2 [json_name = "arch"];
}

message Capabilities {
  bool workspace = 1 [json_name = "workspace"];
  bool project_index = 2 [json_name = "project_index"];
  repeated string build = 3 [json_name = "build"];
  repeated string test = 4 [json_name = "test"];
  bool git = 5 [json_name = "git"];
  repeated string languages = 6 [json_name = "languages"];
}

message CapabilitiesResult {
  string agent_version = 1 [json_name = "agent_version"];
  Platform platform = 2 [json_name = "platform"];
  Capabilities capabilities = 3 [json_name = "capabilities"];
  string protocol_version = 4 [json_name = "protocol_version"];
  repeated string supported_tools = 5 [json_name = "supported_tools"];
}

message Approval {
  string approval_id = 1 [json_name = "approval_id"];
  string type = 2 [json_name = "type"];
  ApprovalDecision decision = 3 [json_name = "decision"];
  string reason = 4 [json_name = "reason"];
  string diff_hash = 5 [json_name = "diff_hash"];
  string resource_id = 6 [json_name = "resource_id"];
}

message FileChange {
  string path = 1 [json_name = "path"];
  ChangeOperation operation = 2 [json_name = "operation"];
  string base_hash = 3 [json_name = "base_hash"];
  string content = 4 [json_name = "content"];
  string target_path = 5 [json_name = "target_path"];
}

message ProposedChangeSet {
  string change_set_id = 1 [json_name = "change_set_id"];
  string workspace_id = 2 [json_name = "workspace_id"];
  string base_workspace_revision = 3 [json_name = "base_workspace_revision"];
  repeated FileChange changes = 4 [json_name = "changes"];
}

message ActualDiff {
  string change_set_id = 1 [json_name = "change_set_id"];
  string diff = 2 [json_name = "diff"];
  string diff_hash = 3 [json_name = "diff_hash"];
  string workspace_id = 4 [json_name = "workspace_id"];
}
